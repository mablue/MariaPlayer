name: Release

on:
  workflow_run:
    workflows: ["Android CI / CD Build"]
    types: [completed]
    branches: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.1.0)'
        required: true
        type: string
      run_id:
        description: 'CI/CD Run ID to fetch artifacts from (optional; defaults to latest successful)'
        required: false
        type: string

jobs:
  publish-release:
    name: Publish GitHub Release from Built Artifacts
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine Target Run ID & Version Tag
        id: resolve-meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version }}"
            TARGET_RUN_ID="${{ inputs.run_id }}"
            if [ -z "$TARGET_RUN_ID" ]; then
              TARGET_RUN_ID=$(gh run list --workflow "Android CI / CD Build" --status success --limit 1 --json databaseId -q '.[0].databaseId')
            fi
          else
            TAG_NAME="${{ github.event.workflow_run.head_branch }}"
            TARGET_RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          echo "target_run_id=$TARGET_RUN_ID" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download Built Artifacts (SmartMusic-Release-APK)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SmartMusic-Release-APK
          path: release-artifacts
          run-id: ${{ steps.resolve-meta.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Built Artifacts (SmartMusic-Debug-APK fallback)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: SmartMusic-Debug-APK
          path: debug-artifacts
          run-id: ${{ steps.resolve-meta.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-meta.outputs.tag_name }}
          name: SmartMusic ${{ steps.resolve-meta.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            debug-artifacts/*.apk
