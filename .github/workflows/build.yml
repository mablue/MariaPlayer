name: Android CI / CD Build

on:
  push:
    branches: [ "main", "master", "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Wrapper & Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

  build:
    name: Build & Assemble APKs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Keystores & Configuration (Single Source of Truth)
        id: keystore-setup
        run: |
          mkdir -p $HOME/.android

          # 1. Guarantee debug.keystore exists in rootDir and ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating standard debug.keystore using keytool"
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore $HOME/.android/debug.keystore || true

          # 2. Guarantee my-upload-key.jks exists with alias upload
          # Try to decode provided secret first. If no secret, but a checked-in keystore
          # exists, make sure we still set STORE_PASSWORD/KEY_PASSWORD (defaults to 'android')
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> $GITHUB_ENV
            if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
              echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            else
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            else
              # default key password to the store password
              if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
                echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
              else
                echo "KEY_PASSWORD=android" >> $GITHUB_ENV
              fi
            fi
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            else
              STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
              if [ -z "$STORE_PASS" ]; then STORE_PASS=android; fi
              DETECTED_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASS" 2>/dev/null | awk -F',' '/PrivateKeyEntry/{print $1; exit}')
              echo "KEY_ALIAS=${DETECTED_ALIAS:-upload}" >> $GITHUB_ENV
            fi
          elif [ -f "my-upload-key.jks" ]; then
            # Keystore is present in the repo. Ensure we export sensible defaults
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> $GITHUB_ENV
            if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
              echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            else
              echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            else
              # default key password to the store password value we chose above
              if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
                echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
              else
                echo "KEY_PASSWORD=android" >> $GITHUB_ENV
              fi
            fi
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            else
              # Attempt to detect the alias using the chosen store password
              STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
              if [ -z "$STORE_PASS" ]; then STORE_PASS=android; fi
              DETECTED_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASS" 2>/dev/null | awk -F',' '/PrivateKeyEntry/{print $1; exit}')
              echo "KEY_ALIAS=${DETECTED_ALIAS:-upload}" >> $GITHUB_ENV
            fi
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback upload keystore with alias 'upload'"
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MariaPlayer,OU=Android,O=MariaPlayer,C=US"
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi

          # 3. Guarantee google-services.json exists
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123","project_id":"mariaplayer"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"ir.ma[...]"}}]}'
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMusic-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMusic-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore

  test:
    name: Run Unit Tests & Quality Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare keystores and config for unit tests
        run: |
          mkdir -p $HOME/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore $HOME/.android/debug.keystore || true

          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=MariaPlayer,OU=Android,O=MariaPlayer,C=US"
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123","project_id":"mariaplayer"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"ir.ma[...]"}}]}'
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Gate (Unit Tests)
        run: ./gradlew testDebugUnitTest --stacktrace
