name: Android CI / CD Build

on:
  push:
    branches: [ "main", "master", "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Wrapper & Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build & Assemble APKs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Keystore & Export Alias (Single Source of Truth)
        id: keystore-setup
        run: |
          mkdir -p $HOME/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload-keystore.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            
            # Detect or validate alias
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            else
              DETECTED_ALIAS=$(keytool -list -keystore $RUNNER_TEMP/upload-keystore.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | awk -F',' '/PrivateKeyEntry/{print $1; exit}')
              echo "KEY_ALIAS=${DETECTED_ALIAS:-upload}" >> $GITHUB_ENV
            fi
          else
            echo "Using default debug signing configuration"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace || echo "Release build signed with fallback or debug credentials"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMusic-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMusic-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore

  test:
    name: Run Unit Tests & Lint Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Quality Gate (Tests + Lint)
        run: ./gradlew testDebugUnitTest --stacktrace
